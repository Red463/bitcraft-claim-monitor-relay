name: Deploy Relay preview

on:
  workflow_dispatch:
    inputs:
      force_database_backup:
        description: Create a manual Relay database backup even when the schema is unchanged
        required: false
        type: boolean
        default: false
      expected_revision:
        description: Exact merged revision for an automatic schema release (empty for manual deployment)
        required: false
        type: string
      schema_base_revision:
        description: Previously deployed parent of the fingerprint-only release
        required: false
        type: string
      schema_issue:
        description: Schema incident number to resolve after verified recovery
        required: false
        type: string

permissions:
  contents: read

env:
  SCHEMA_APP_ORIGIN: ${{ vars.RELAY_SCHEMA_APP_ORIGIN }}
  SCHEMA_REGION_IDS: ${{ vars.RELAY_SCHEMA_REGION_IDS }}
  SCHEMA_CLAIM_ID: ${{ vars.RELAY_SCHEMA_CLAIM_ID }}
  SCHEMA_REGION_ID: ${{ vars.RELAY_SCHEMA_REGION_ID }}
  SCHEMA_RESOURCE_ID: ${{ vars.RELAY_SCHEMA_RESOURCE_ID || '54' }}

concurrency:
  group: relay-preview
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate automatic release revision and file scope
        if: inputs.expected_revision != '' || inputs.schema_base_revision != '' || inputs.schema_issue != ''
        env:
          AUTO_RELEASE: ${{ vars.RELAY_SCHEMA_AUTO_RELEASE }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          BASE_REVISION: ${{ inputs.schema_base_revision }}
          ISSUE_NUMBER: ${{ inputs.schema_issue }}
        run: |
          test "$AUTO_RELEASE" = 'true'
          test "$EXPECTED_REVISION" = "$GITHUB_SHA"
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD^)" = "$BASE_REVISION"
          node scripts/relay-schema-release.mjs validate "$BASE_REVISION" "$GITHUB_SHA"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Refuse stale Relay schema bindings
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          if [[ -n "$EXPECTED_REVISION" ]]; then
            node apps/bitcraft-local/scripts/check-relay-schema-drift.mjs --all-regions
          else
            node apps/bitcraft-local/scripts/check-relay-schema-drift.mjs
          fi
      - name: Test application
        run: corepack pnpm --filter @workspace/bitcraft-local test
      - name: Build application
        run: corepack pnpm --filter @workspace/bitcraft-local run build
      - name: Package revision-bound build outputs
        run: |
          artifact_root="$RUNNER_TEMP/relay-build-artifact"
          upload_root="$RUNNER_TEMP/relay-build-upload"
          mkdir -p "$upload_root"
          node scripts/package-relay-build.mjs \
            --repository-root "$GITHUB_WORKSPACE" \
            --revision "$GITHUB_SHA" \
            --output-dir "$artifact_root"
          archive="$RUNNER_TEMP/relay-build.tar.gz"
          tar -C "$artifact_root" -czf "$archive" .
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          mv "$archive" "$upload_root/bitcraft-build-$digest.tar.gz"
          printf '%s\n' "$digest" > "$upload_root/digest.txt"
      - name: Retain verified build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: relay-build-${{ github.sha }}
          path: ${{ runner.temp }}/relay-build-upload
          if-no-files-found: error
          retention-days: 1
      - name: Test deployment contracts
        # These contracts exercise root-owned production metadata and chown semantics.
        run: sudo "$(command -v node)" --test scripts/test/deploy-*.test.mjs scripts/test/relay-build-artifact.test.mjs
      - name: Validate Relay systemd units
        run: |
          test -x /usr/bin/node || sudo ln -s "$(command -v node)" /usr/bin/node
          systemd-analyze verify \
            deploy/bitcraft-claim-monitor-relay.service \
            deploy/bitcraft-claim-monitor-relay-worker.service \
            deploy/bitcraft-claim-monitor-relay-collector.service \
            deploy/bitcraft-claim-monitor-relay-collector.timer \
            deploy/bitcraft-claim-monitor-relay-backup.service \
            deploy/bitcraft-claim-monitor-relay-backup.timer \
            deploy/bitcraft-claim-monitor-relay-map-terrain.service \
            deploy/bitcraft-claim-monitor-relay-map-terrain.timer \
            deploy/bitcraft-claim-monitor-relay-map-roads.service \
            deploy/bitcraft-claim-monitor-relay-map-roads.timer
      - name: Validate coexistence Caddy example
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            caddy:2.11.3-alpine \
            /usr/bin/caddy validate --config deploy/Caddyfile.example

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: relay-preview
    steps:
      - name: Check out deployment diagnostics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24 for post-approval checks
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recheck Relay schema after approval
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          BASE_REVISION: ${{ inputs.schema_base_revision }}
          AUTO_RELEASE: ${{ vars.RELAY_SCHEMA_AUTO_RELEASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$EXPECTED_REVISION" ]]; then
            test "$AUTO_RELEASE" = 'true'
            test "$EXPECTED_REVISION" = "$GITHUB_SHA"
            node scripts/relay-schema-release.mjs validate-deploy "$BASE_REVISION" "$GITHUB_SHA"
            node apps/bitcraft-local/scripts/check-relay-schema-drift.mjs --all-regions
          else
            node apps/bitcraft-local/scripts/check-relay-schema-drift.mjs
          fi
      - name: Download verified build outputs
        uses: actions/download-artifact@v4
        with:
          name: relay-build-${{ github.sha }}
          path: ${{ runner.temp }}/relay-build-download
      - name: Configure pinned SSH identity
        env:
          RELAY_VPS_SSH_PRIVATE_KEY: ${{ secrets.RELAY_VPS_SSH_PRIVATE_KEY }}
          RELAY_VPS_KNOWN_HOSTS: ${{ secrets.RELAY_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$RELAY_VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$RELAY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify installed deployment updater capability
        env:
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          CAPABILITIES="$(ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --capabilities")"
          grep -Fxq 'relay-build-artifact-v1' <<<"$CAPABILITIES"
      - name: Deploy verified Relay revision
        id: install
        env:
          BUILD_ARTIFACT_DIR: ${{ runner.temp }}/relay-build-download
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
          FORCE_DATABASE_BACKUP: ${{ inputs.force_database_backup }}
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          BACKUP_OPTION=""
          if [[ "$FORCE_DATABASE_BACKUP" == "true" ]]; then
            BACKUP_OPTION=" --force-backup"
          fi
          DIGEST="$(cat "$BUILD_ARTIFACT_DIR/digest.txt")"
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          ARTIFACT_PATH="$BUILD_ARTIFACT_DIR/bitcraft-build-$DIGEST.tar.gz"
          [[ -f "$ARTIFACT_PATH" && ! -L "$ARTIFACT_PATH" ]]
          [[ "$(sha256sum "$ARTIFACT_PATH" | cut -d ' ' -f 1)" == "$DIGEST" ]]
          set +e
          CAPABILITIES="$(ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --capabilities" 2>/dev/null)"
          CAPABILITY_STATUS=$?
          set -e
          BUILD_OPTION=""
          if [[ "$CAPABILITY_STATUS" -eq 0 ]] && grep -Fqx 'relay-build-artifact-v1' <<<"$CAPABILITIES"; then
            scp -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -- "$ARTIFACT_PATH" "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST:bitcraft-build-${DIGEST}.tar.gz"
            BUILD_OPTION=" --build-artifact-sha256 '$DIGEST'"
          fi
          set +e
          DEPLOY_OUTPUT="$(ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --revision '$GITHUB_SHA'$BACKUP_OPTION$BUILD_OPTION" 2>&1)"
          DEPLOY_STATUS=$?
          set -e

          if [[ "$DEPLOY_STATUS" -eq 0 ]]; then
            DEPLOY_FAILURE_CATEGORY="none"
          else
            DEPLOY_FAILURE_CATEGORY="$(node scripts/classify-relay-deploy-failure.mjs <<<"$DEPLOY_OUTPUT")"
          fi
          case "$DEPLOY_FAILURE_CATEGORY" in
            none|rollback|out-of-memory|startup-module|web-service|worker-service|public-check|health-timeout|artifact-capability|artifact-argument|artifact-archive|argument-validation|busy|prepare|other) ;;
            *) DEPLOY_FAILURE_CATEGORY="other" ;;
          esac
          printf 'Deployment failure category: %s\n' "$DEPLOY_FAILURE_CATEGORY"

          ROAD_FAILURE_CATEGORY="$(sed -n 's/.*"roadUnit":.*"failure":{"category":"\([a-z-]*\)"}.*/\1/p' <<<"$DEPLOY_OUTPUT" | tail -n 1)"
          case "$ROAD_FAILURE_CATEGORY" in
            empty-region|join-mismatch|timeout|schema|invalid-coordinate|out-of-memory|subscription|connection|module|filesystem|disk|render|busy|implementation|other|unavailable) ;;
            *) ROAD_FAILURE_CATEGORY="unavailable" ;;
          esac
          printf 'Road generator failure category: %s\n' "$ROAD_FAILURE_CATEGORY"

          {
            printf '## Relay preview deployment\n\n'
            printf 'Revision: `%s`  \n' "$GITHUB_SHA"
            printf 'Result: `%s`\n\n' "$([[ "$DEPLOY_STATUS" -eq 0 ]] && printf success || printf failed)"
            printf 'Deployment failure category: `%s`\n\n' "$DEPLOY_FAILURE_CATEGORY"
            printf 'Road generator failure category: `%s`\n\n' "$ROAD_FAILURE_CATEGORY"
            printf 'Remote diagnostics are retained on the VPS and are not copied into GitHub output.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$DEPLOY_STATUS"
      - name: Confirm fresh production generations and map subscription
        if: inputs.expected_revision != ''
        env:
          SCHEMA_EXPECTED_REVISION: ${{ inputs.expected_revision }}
          SCHEMA_DEPLOY_STARTED_AT: ${{ steps.install.outputs.started_at }}
        run: |
          node scripts/verify-relay-schema-recovery.mjs
          node apps/bitcraft-local/scripts/check-relay-schema-drift.mjs --all-regions

  schema-outcome:
    if: always() && inputs.expected_revision != ''
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Report production recovery or required action
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SCHEMA_ISSUE_NUMBER: ${{ inputs.schema_issue }}
        run: |
          if [[ "$VERIFY_RESULT" == 'success' && "$DEPLOY_RESULT" == 'success' ]]; then
            node scripts/relay-schema-incident.mjs recovered
          else
            node scripts/relay-schema-incident.mjs failed
          fi
