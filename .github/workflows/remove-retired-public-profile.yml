name: Remove retired public Claim Monitor profile

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type remove-claim-monitor.com exactly to permanently remove public data and configuration
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: relay-retired-public-profile-removal
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main and exact destructive confirmation
        env:
          REMOVAL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REMOVAL_CONFIRMATION" = "remove-claim-monitor.com"
          test "${#GITHUB_SHA}" -eq 40
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build and test the application
        run: |
          corepack pnpm --filter @workspace/bitcraft-local run build
          corepack pnpm --filter @workspace/bitcraft-local test
      - name: Test protected removal tooling
        run: node --experimental-strip-types --test scripts/test/deploy-remove-retired-public-profile.test.mjs

  inspect:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: relay-preview
    steps:
      - name: Configure pinned SSH identity
        env:
          RELAY_VPS_SSH_PRIVATE_KEY: ${{ secrets.RELAY_VPS_SSH_PRIVATE_KEY }}
          RELAY_VPS_KNOWN_HOSTS: ${{ secrets.RELAY_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$RELAY_VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$RELAY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect retired public data and configuration
        env:
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --revision '$GITHUB_SHA' --inspect-retired-public-profile" \
            > "$RUNNER_TEMP/retired-public-inspection.json"
      - uses: actions/upload-artifact@v4
        with:
          name: retired-public-profile-inspection
          path: ${{ runner.temp }}/retired-public-inspection.json
          retention-days: 7

  remove:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: relay-cutover
    steps:
      - name: Configure pinned SSH identity
        env:
          RELAY_VPS_SSH_PRIVATE_KEY: ${{ secrets.RELAY_VPS_SSH_PRIVATE_KEY }}
          RELAY_VPS_KNOWN_HOSTS: ${{ secrets.RELAY_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$RELAY_VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$RELAY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Permanently remove retired public data and configuration
        env:
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --revision '$GITHUB_SHA' --remove-retired-public-profile --confirmation 'remove-claim-monitor.com'" \
            >/dev/null
      - name: Verify dedicated production invariants
        env:
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          curl --fail --silent --show-error https://app.timbersteeltrade.com/api/local/health > "$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error https://app.timbersteeltrade.com/api/local/bootstrap > "$RUNNER_TEMP/bootstrap.json"
          node -e 'const fs=require("fs"); const health=JSON.parse(fs.readFileSync(process.argv[1])); const bootstrap=JSON.parse(fs.readFileSync(process.argv[2])); const expectedRevision=process.argv[3].slice(0,12); if (!health.ok || health.deploymentMode !== "canonical" || !health.discordReady || health.buildSha !== expectedRevision || !bootstrap.config?.claimId || bootstrap.build?.buildSha !== expectedRevision) process.exit(1)' "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/bootstrap.json" "$GITHUB_SHA"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo systemctl is-active --quiet bitcraft-claim-monitor-relay-worker.service bitcraft-claim-monitor-relay-collector.timer; worker_pid=\$(sudo systemctl show --property MainPID --value bitcraft-claim-monitor-relay-worker.service); test \"\$worker_pid\" -gt 1; gateway_pids=\$(sudo pgrep -f '/apps/bitcraft-local/worker\\.mjs' || true); test \"\$gateway_pids\" = \"\$worker_pid\"; sudo caddy validate --config /etc/caddy/Caddyfile; sudo sqlite3 /var/lib/bitcraft-claim-monitor-relay/bitcraft-local.sqlite 'PRAGMA integrity_check;' | grep -Fx ok; test \"\$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: claim-monitor.com' http://127.0.0.1:19430/)\" = 421; ! sudo grep -Eq '(^|[[:space:]])(www\\.)?claim-monitor\\.com[[:space:]]*\\{' /etc/caddy/Caddyfile"
